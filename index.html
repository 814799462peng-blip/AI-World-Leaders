<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 世界领导人模拟群聊</title><style>body{font-family:system-ui;background:#f3f5fa;margin:0;color:#202738}main{max-width:760px;margin:25px auto;padding:20px;background:white;border-radius:16px}h1{font-size:25px}.note{color:#666;font-size:13px}#chat{height:55vh;overflow:auto;background:#f8f9fc;padding:14px;border-radius:12px}.msg{padding:10px;margin:9px 0;background:white;border:1px solid #e5e7ee;border-radius:10px}.who{font-weight:bold}button{padding:12px 18px;border:0;border-radius:9px;background:#2258c9;color:white;cursor:pointer;margin:6px}input{padding:11px;width:65%;border:1px solid #ddd;border-radius:8px}</style><main><h1>🌍 AI 世界领导人模拟群聊</h1><p class="note">演示版本：所有发言均为虚构模拟，不代表真实人物观点；目前不连接 AI 或实时新闻。</p><label>讨论主题 <input id="topic" value="国际合作与地区安全"></label><div><button id="start">开始自动聊天</button><button id="pause">暂停</button><button id="clear">清空</button></div><div id="chat" aria-live="polite"></div></main><script>
const people=[["特朗普（模拟）","美国的经济与安全利益应该成为谈判的重要部分。"],["普京（模拟）","地区安全安排需要考虑各方长期关切。"],["泽连斯基（模拟）","任何方案都应尊重国家主权与领土完整。"],["以色列总理（模拟）","保障民众安全和防止冲突升级是关键问题。"],["菲律宾总统（模拟）","区域国家应通过外交和国际法处理争端。"],["秦始皇（历史人物模拟）","朕以为治国须重视法度、秩序与长远谋划；诸国亦当思量如何止争。"]];
let timer=null,i=0;const chat=document.querySelector('#chat');function say(){const [name,line]=people[i++%people.length];const div=document.createElement('div');div.className='msg';const b=document.createElement('div');b.className='who';b.textContent=name;const p=document.createElement('div');p.textContent='关于“'+(document.querySelector('#topic').value||'国际事务')+'”：'+line;div.append(b,p);chat.append(div);chat.scrollTop=chat.scrollHeight}
document.querySelector('#start').onclick=()=>{if(timer)return;say();timer=setInterval(say,2400)};document.querySelector('#pause').onclick=()=>{clearInterval(timer);timer=null};document.querySelector('#clear').onclick=()=>{clearInterval(timer);timer=null;chat.replaceChildren();i=0};
</script></html>
